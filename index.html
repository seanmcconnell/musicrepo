<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean McConnell</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-pic {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 2px solid #333;
            background-color: #1a1a1a;
        }

        .profile-pic-placeholder {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 2px solid #333;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #666;
        }

        .name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 28px;
            text-align: center;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
            position: relative;
        }

        .link-button:hover {
            background-color: #2a2a2a;
            border-color: #555;
            transform: scale(1.02);
        }

        .link-button:active {
            transform: scale(0.98);
        }

        .link-icon {
            position: absolute;
            left: 16px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .section-header {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            margin-top: 24px;
            margin-bottom: 8px;
            align-self: flex-start;
        }

        .audio-section {
            width: 100%;
            margin-top: 32px;
        }

        .audio-player {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .audio-player .track-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .audio-player audio {
            width: 100%;
            height: 36px;
            filter: invert(1) hue-rotate(180deg);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #444;
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 16px;
            }

            .link-button {
                padding: 14px 16px;
                font-size: 15px;
            }
        }
    </style>
</head>
